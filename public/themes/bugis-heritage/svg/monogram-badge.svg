<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
    <!-- Monogram Badge: Diamond crest badge for couple initial -->
    <polygon points="50,4 96,50 50,96 4,50" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.85" fill="none"/>
    <polygon points="50,10 90,50 50,90 10,50" stroke="currentColor" stroke-width="0.8" stroke-opacity="0.45" fill="none"/>
    <circle cx="50" cy="4" r="2.5" fill="currentColor"/>
    <circle cx="96" cy="50" r="2.5" fill="currentColor"/>
    <circle cx="50" cy="96" r="2.5" fill="currentColor"/>
    <circle cx="4" cy="50" r="2.5" fill="currentColor"/>
    <!-- Inner corner accent dots -->
    <circle cx="50" cy="18" r="1.2" fill="currentColor" fill-opacity="0.6"/>
    <circle cx="82" cy="50" r="1.2" fill="currentColor" fill-opacity="0.6"/>
    <circle cx="50" cy="82" r="1.2" fill="currentColor" fill-opacity="0.6"/>
    <circle cx="18" cy="50" r="1.2" fill="currentColor" fill-opacity="0.6"/>
</svg>
