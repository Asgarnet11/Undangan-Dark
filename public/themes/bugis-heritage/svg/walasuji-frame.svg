<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
    <!-- Walasuji Frame: Geometrical diamond frame for couple photo -->
    <defs>
        <clipPath id="bh-diamond-clip">
            <polygon points="200,16 384,200 200,384 16,200"/>
        </clipPath>
    </defs>
    <!-- Outer framing lines -->
    <polygon points="200,6 394,200 200,394 6,200" stroke="currentColor" stroke-width="1.8" stroke-opacity="0.85"/>
    <polygon points="200,12 388,200 200,388 12,200" stroke="currentColor" stroke-width="0.8" stroke-opacity="0.45"/>
    <polygon points="200,16 384,200 200,384 16,200" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.9"/>
    <!-- Decorative corner markers -->
    <circle cx="200" cy="6" r="3.5" fill="currentColor"/>
    <circle cx="394" cy="200" r="3.5" fill="currentColor"/>
    <circle cx="200" cy="394" r="3.5" fill="currentColor"/>
    <circle cx="6" cy="200" r="3.5" fill="currentColor"/>
    <!-- Accent inner diamonds -->
    <polygon points="200,24 206,30 200,36 194,30" fill="currentColor" fill-opacity="0.75"/>
    <polygon points="376,200 370,206 364,200 370,194" fill="currentColor" fill-opacity="0.75"/>
    <polygon points="200,376 206,370 200,364 194,370" fill="currentColor" fill-opacity="0.75"/>
    <polygon points="24,200 30,206 36,200 30,194" fill="currentColor" fill-opacity="0.75"/>
</svg>
