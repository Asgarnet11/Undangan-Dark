<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
    <!-- Grain Silk: Microscopic texture simulating silk weave fabric (lipa' sabbe texture overlay) -->
    <defs>
        <pattern id="bh-silk-weave" width="8" height="8" patternUnits="userSpaceOnUse">
            <line x1="0" y1="2" x2="8" y2="2" stroke="currentColor" stroke-width="0.35" stroke-opacity="0.08"/>
            <line x1="0" y1="6" x2="8" y2="6" stroke="currentColor" stroke-width="0.35" stroke-opacity="0.08"/>
            <line x1="2" y1="0" x2="2" y2="8" stroke="currentColor" stroke-width="0.35" stroke-opacity="0.08"/>
            <line x1="6" y1="0" x2="6" y2="8" stroke="currentColor" stroke-width="0.35" stroke-opacity="0.08"/>
            <circle cx="4" cy="4" r="0.5" fill="currentColor" fill-opacity="0.12"/>
        </pattern>
    </defs>
    <rect width="100" height="100" fill="url(#bh-silk-weave)"/>
</svg>
