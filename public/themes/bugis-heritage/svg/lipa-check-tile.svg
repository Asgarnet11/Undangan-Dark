<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60" fill="none">
    <!-- Lipa Check Tile: Abstract silk sarong grid pattern -->
    <rect width="60" height="60" fill="none"/>
    <line x1="0" y1="15" x2="60" y2="15" stroke="currentColor" stroke-width="0.7" stroke-opacity="0.18"/>
    <line x1="0" y1="30" x2="60" y2="30" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.28"/>
    <line x1="0" y1="45" x2="60" y2="45" stroke="currentColor" stroke-width="0.7" stroke-opacity="0.18"/>
    <line x1="15" y1="0" x2="15" y2="60" stroke="currentColor" stroke-width="0.7" stroke-opacity="0.18"/>
    <line x1="30" y1="0" x2="30" y2="60" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.28"/>
    <line x1="45" y1="0" x2="45" y2="60" stroke="currentColor" stroke-width="0.7" stroke-opacity="0.18"/>
    <!-- Intersection accent diamonds -->
    <polygon points="30,27 33,30 30,33 27,30" fill="currentColor" fill-opacity="0.35"/>
    <polygon points="0,28 2,30 0,32" fill="currentColor" fill-opacity="0.25"/>
    <polygon points="60,28 60,32 58,30" fill="currentColor" fill-opacity="0.25"/>
    <polygon points="28,0 32,0 30,2" fill="currentColor" fill-opacity="0.25"/>
    <polygon points="28,60 32,60 30,58" fill="currentColor" fill-opacity="0.25"/>
</svg>
